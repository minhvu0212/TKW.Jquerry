<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 11 - Hiển thị tên và phần mở rộng tập tin</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="Scripts/script.js" defer></script>
</head>
<body class="light-theme">
<main>
<h1>Câu 11: Thông tin tập tin</h1>
<p>Chọn một tập tin để xem tên và phần mở rộng của tập tin đó.</p>
<div class="panel">
  <label for="fileInput">Chọn tập tin</label>
  <input type="file" id="fileInput">
  <p><strong>Tên tập tin:</strong> <span id="fileName">Chưa chọn tập tin</span></p>
  <p><strong>Phần mở rộng:</strong> <span id="fileExt">—</span></p>
</div>
</main>
</body>
</html>
