<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 13 - Hiện hoặc ẩn mật khẩu</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="Scripts/script.js" defer></script>
</head>
<body class="light-theme">
<main>
<h1>Câu 13: Hiện hoặc ẩn mật khẩu</h1>
<div class="panel">
  <label for="password">Mật khẩu</label>
  <div class="password-row">
    <input type="password" id="password" placeholder="Nhập mật khẩu">
    <button type="button" id="togglePassword" aria-label="Hiện mật khẩu" title="Hiện/ẩn mật khẩu">👁</button>
  </div>
  <p id="passwordStatus" class="hint">Mật khẩu đang được ẩn.</p>
</div>
</main>
</body>
</html>
