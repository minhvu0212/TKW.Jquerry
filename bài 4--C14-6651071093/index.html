<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 14 - Chuyển đổi giao diện sáng và tối</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="Scripts/script.js" defer></script>
</head>
<body class="light-theme">
<main>
<h1>Câu 14: Chế độ giao diện</h1>
<div class="panel">
  <p>Chọn On để dùng giao diện sáng, Off để dùng giao diện tối.</p>
  <div class="switch-row">
    <span>Off</span>
    <label class="switch">
      <input type="checkbox" id="themeSwitch" checked>
      <span class="slider"></span>
    </label>
    <span>On</span>
  </div>
  <p id="themeStatus">Chế độ sáng đang bật.</p>
</div>
</main>
</body>
</html>
