<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 17 - Accordion</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="Scripts/script.js" defer></script>
</head>
<body class="light-theme">
<main>
<h1>Câu 17: Accordion</h1>
<div class="accordion">
  <div class="accordion-item">
    <button class="accordion-heading">Phần 1: HTML</button>
    <div class="accordion-content"><p>HTML dùng để tạo cấu trúc nội dung của trang web.</p></div>
  </div>
  <div class="accordion-item">
    <button class="accordion-heading">Phần 2: CSS</button>
    <div class="accordion-content"><p>CSS dùng để định dạng giao diện, màu sắc và bố cục trang web.</p></div>
  </div>
  <div class="accordion-item">
    <button class="accordion-heading">Phần 3: JavaScript</button>
    <div class="accordion-content"><p>JavaScript giúp trang web có thể tương tác với người dùng.</p></div>
  </div>
</div>
</main>
</body>
</html>
