<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 15 - Tạo các thẻ Tab</title>
    <link rel="stylesheet" href="Styles/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="Scripts/script.js" defer></script>
</head>
<body class="light-theme">
<main>
<h1>Câu 15: Tab nội dung</h1>
<div class="panel">
  <div class="tabs">
    <button class="tab active" data-tab="tab1">Trang chủ</button>
    <button class="tab" data-tab="tab2">Giới thiệu</button>
    <button class="tab" data-tab="tab3">Liên hệ</button>
  </div>
  <div id="tab1" class="tab-content active">
    <h2>Trang chủ</h2>
    <p>Chào mừng bạn đến với trang mẫu sử dụng tab.</p>
  </div>
  <div id="tab2" class="tab-content">
    <h2>Giới thiệu</h2>
    <p>Đây là phần giới thiệu. Bạn có thể thay nội dung theo yêu cầu bài học.</p>
  </div>
  <div id="tab3" class="tab-content">
    <h2>Liên hệ</h2>
    <p>Email: example@email.com</p>
  </div>
</div>
</main>
</body>
</html>
